name: Saturday Route Pings

on:
  # No internal "schedule:" trigger here on purpose - see README.md. Timing for
  # both the 10:30-10:55 (every 5 min) and 11:00-11:15 (every 3 min) Saturday
  # windows is owned by two external cron-job.org jobs calling workflow_dispatch.
  workflow_dispatch: {}

jobs:
  send-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run route-only ping
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: route_only
        run: python morning_briefing.py
