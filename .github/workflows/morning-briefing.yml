name: Morning Briefing

on:
  schedule:
    # 06:30 UTC = 07:30 during BST (summer) / 06:30 during GMT (winter) - full daily briefing
    - cron: "30 6 * * *"
    # Saturday 09:30-09:55 UTC = 10:30-10:55 BST, every 5 min - route-only ping
    - cron: "30-55/5 9 * * 6"
    # Saturday 10:00-10:15 UTC = 11:00-11:15 BST, every 3 min - route-only ping
    - cron: "0-15/3 10 * * 6"
  workflow_dispatch:
    inputs:
      force_route_check:
        description: "Include the Virgin Active Strand route check even if today isn't Saturday (for testing)"
        type: boolean
        default: false
      force_office_check:
        description: "Include the office route check even if today isn't a weekday (for testing)"
        type: boolean
        default: false
      mode:
        description: "Message type to send"
        type: choice
        options:
          - full
          - route_only
        default: full

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run mode
        id: run_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=route_only" >> "$GITHUB_OUTPUT"
          fi

      - name: Run morning briefing
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: ${{ steps.run_mode.outputs.mode }}
          FORCE_ROUTE_CHECK: ${{ github.event.inputs.force_route_check }}
          FORCE_OFFICE_CHECK: ${{ github.event.inputs.force_office_check }}
        run: python morning_briefing.py
