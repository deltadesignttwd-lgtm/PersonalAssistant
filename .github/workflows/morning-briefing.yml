name: Morning Briefing

on:
  # No internal "schedule:" trigger here on purpose. GitHub Actions' native cron is
  # best-effort with no delivery-time guarantee (observed 1-3h delays in practice).
  # Timing is instead owned by an external scheduler (e.g. cron-job.org) that calls
  # the GitHub REST API to fire workflow_dispatch at the exact desired time -
  # workflow_dispatch runs consistently start within seconds, unlike schedule runs.
  workflow_dispatch:
    inputs:
      force_route_check:
        description: "Include the Virgin Active Strand route check even if today isn't Saturday (for testing)"
        type: boolean
        default: false
      force_office_check:
        description: "Include the office route check even if today isn't a weekday (for testing)"
        type: boolean
        default: false
      force_wlw_check:
        description: "Include the Thu/Fri events check even if today isn't Sunday (for testing)"
        type: boolean
        default: false
      simulated_now:
        description: "Simulate 'now' as this ISO datetime (e.g. 2026-09-28T07:00:00) to test day-of-week-specific sections (for testing). Leave blank to use the real current time."
        type: string
        default: ""

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning briefing
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: full
          FORCE_ROUTE_CHECK: ${{ github.event.inputs.force_route_check }}
          FORCE_OFFICE_CHECK: ${{ github.event.inputs.force_office_check }}
          FORCE_WLW_CHECK: ${{ github.event.inputs.force_wlw_check }}
          SIMULATED_NOW: ${{ github.event.inputs.simulated_now }}
        run: python morning_briefing.py
