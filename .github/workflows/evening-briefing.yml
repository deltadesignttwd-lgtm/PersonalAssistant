name: Evening Briefing

on:
  # No internal "schedule:" trigger here on purpose - see README.md. Timing
  # (weekdays 17:30 London time) is owned by an external cron-job.org job
  # calling workflow_dispatch, same pattern as the other two workflows.
  workflow_dispatch:
    inputs:
      simulated_now:
        description: >-
          Simulate "now" as this ISO datetime (e.g. 2026-10-09T17:30:00) so
          the Friday-only planned-events section reacts as if it were
          actually Friday, regardless of the real day. Leave blank to use
          the real current time.
        required: false
        default: ""

jobs:
  send-evening-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening route check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: evening
          SIMULATED_NOW: ${{ inputs.simulated_now }}
        run: python morning_briefing.py
